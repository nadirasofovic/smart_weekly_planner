name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Railway
      uses: bervProject/railway-deploy@v0.3.0
      with:
        railway_token: ${{ secrets.RAILWAY_TOKEN }}
        service: backend

